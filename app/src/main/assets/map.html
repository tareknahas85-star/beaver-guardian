<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>html,body,#map{height:100%;margin:0;padding:0}</style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);
    var marker = null, circle = null, centered = false;
    function update(lat, lng, radius, glat, glng, geo) {
      if (circle) { map.removeLayer(circle); circle = null; }
      if (geo && glat && glng) {
        circle = L.circle([glat, glng], { radius: radius, color: '#4F46E5', fillColor: '#4F46E5', fillOpacity: 0.12 }).addTo(map);
      }
      if (lat || lng) {
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map);
        if (!centered) { map.setView([lat, lng], 16); centered = true; }
      }
    }
    window.update = update;
  </script>
</body>
</html>
